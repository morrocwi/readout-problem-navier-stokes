name: ns-p2-triad-attack

on:
  pull_request:
    branches: [main]
    paths:
      - 'CLAY_P0_P2_RESEARCH_HANDOFF_2026-09-11.md'
      - 'FUTURE_WORK_P2_TRIAD_ATTACK.md'
      - 'paper/NS_P2_TRIAD_PHASE_READOUT_ATTACK.md'
      - 'paper/NS_P2_COMPLEX_PHASE_HOLONOMY.md'
      - 'paper/NS_P2_DYADIC_COMPLEX_PHASE_HOLONOMY.md'
      - 'paper/NS_P2_GEOMETRIC_FRUSTRATION_CUT_FAMILY.md'
      - 'paper/NS_P2_POLARIZATION_GAUGE_FRAME_COVER.md'
      - 'paper/NS_P2_FRAME_COMPATIBLE_DYADIC_HOLONOMY.md'
      - 'reproduction/checks/check_ns_p2_triad_phase_stress.py'
      - 'reproduction/checks/check_ns_p2_triad_coherence_defect.py'
      - 'reproduction/checks/check_ns_p2_n1_h3_sign_frustration.py'
      - 'reproduction/checks/check_ns_p2_n1_frustration_tax.py'
      - 'reproduction/checks/check_ns_p2_ladder_frustration_alln.py'
      - 'reproduction/checks/check_ns_p2_dyadic_hh_motif_alln.py'
      - 'reproduction/checks/check_ns_p2_phase_holonomy.py'
      - 'reproduction/checks/check_ns_p2_dyadic_phase_holonomy_alln.py'
      - 'reproduction/checks/check_ns_p2_geometric_frustration_cut_family.py'
      - 'reproduction/checks/check_ns_p2_polarization_gauge_frame.py'
      - 'reproduction/checks/check_ns_p2_frame_compatible_dyadic_holonomy.py'
      - '.github/workflows/ns-p2-triad-attack.yml'
      - 'CLAY_RESEARCH_TODO.md'
      - 'CLAY_GOVERNANCE_ACK.json'
  workflow_dispatch:

jobs:
  exact-triad-attack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install checker dependencies
        run: python -m pip install numpy sympy
      - name: Exact isolated-triad phase stress
        run: python3 reproduction/checks/check_ns_p2_triad_phase_stress.py
      - name: Exact isolated-triad coherence defect
        run: python3 reproduction/checks/check_ns_p2_triad_coherence_defect.py
      - name: Exact N=1 H3 sign-frustration classification
        run: python3 reproduction/checks/check_ns_p2_n1_h3_sign_frustration.py
      - name: Exact N=1 four-term frustration tax
        run: python3 reproduction/checks/check_ns_p2_n1_frustration_tax.py
      - name: Symbolic all-n ladder frustration family
        run: python3 reproduction/checks/check_ns_p2_ladder_frustration_alln.py
      - name: Symbolic all-n dyadic high-high motif
        run: python3 reproduction/checks/check_ns_p2_dyadic_hh_motif_alln.py
      - name: Symbolic all-n complex phase holonomy
        run: python3 reproduction/checks/check_ns_p2_phase_holonomy.py
      - name: Symbolic all-n dyadic complex phase holonomy
        run: python3 reproduction/checks/check_ns_p2_dyadic_phase_holonomy_alln.py
      - name: Symbolic geometric frustration-cut family
        run: python3 reproduction/checks/check_ns_p2_geometric_frustration_cut_family.py
      - name: Polarization gauge and shared-frame mismatch
        run: python3 reproduction/checks/check_ns_p2_polarization_gauge_frame.py
      - name: Frame-compatible 3D dyadic holonomy
        run: python3 reproduction/checks/check_ns_p2_frame_compatible_dyadic_holonomy.py
      - name: Claim-boundary and handoff guards
        run: |
          python3 - <<'PY'
          from pathlib import Path

          paper = Path('paper/NS_P2_TRIAD_PHASE_READOUT_ATTACK.md').read_text()
          paper_required = {
              'falsification rule': 'Equivalence does not justify rejecting',
              'phase coordinate': 'signed coordinate `r`',
              'shell-only refuted': 'NS-P2-TRIAD-PHASE-01',
              'viscosity-only refuted': 'NS-P2-TRIAD-PHASE-02',
              'N1 sign frustration': 'NS-P2-N1-H3-SIGN-FRUSTRATION',
              'frustration tax': 'frustration tax',
              'open phase-complete target': 'NS-P2-PHASE-COMPLETE-CONTRACTION` — OPEN',
              'open frustration-or-cut': 'NS-P2-FRUSTRATION-OR-CUT` — OPEN',
              'no all-scale claim': 'No all-scale strict deficit has yet been proved',
          }
          missing = [name for name, marker in paper_required.items() if marker not in paper]
          if missing:
              raise SystemExit('missing triad-attack claim markers: ' + ', '.join(missing))

          holonomy = Path('paper/NS_P2_COMPLEX_PHASE_HOLONOMY.md').read_text()
          holonomy_required = {
              'complex holonomy status': 'NS-P2-COMPLEX-HOLONOMY-ALLN` — **DERIVED**',
              'local dichotomy status': 'NS-P2-LOCAL-FRUSTRATION-OR-CUT` — **DERIVED**',
              'parent remains open': 'NS-P2-FRUSTRATION-OR-CUT — OPEN',
          }
          missing = [name for name, marker in holonomy_required.items() if marker not in holonomy]
          if missing:
              raise SystemExit('missing complex-holonomy claim markers: ' + ', '.join(missing))

          dyadic = Path('paper/NS_P2_DYADIC_COMPLEX_PHASE_HOLONOMY.md').read_text()
          dyadic_required = {
              'dyadic holonomy status': 'NS-P2-DYADIC-COMPLEX-HOLONOMY-ALLN` — **DERIVED**',
              'dyadic local dichotomy': 'NS-P2-DYADIC-LOCAL-FRUSTRATION-OR-CUT` — **DERIVED**',
              'coverage remains open': 'It does **not** prove a boundary coverage theorem',
              'parent open': 'NS-P2-FRUSTRATION-OR-CUT — OPEN',
          }
          missing = [name for name, marker in dyadic_required.items() if marker not in dyadic]
          if missing:
              raise SystemExit('missing dyadic-holonomy claim markers: ' + ', '.join(missing))

          geometry = Path('paper/NS_P2_GEOMETRIC_FRUSTRATION_CUT_FAMILY.md').read_text()
          geometry_required = {
              'factor PASS': 'NS-P2-GEOMETRIC-CHANNEL-FACTOR` — **PASS**',
              'trichotomy': 'NS-P2-GEOMETRIC-PHASE-TRICHOTOMY` — **DERIVED**',
              'near-dyadic cut': 'NS-P2-GEOMETRIC-NEAR-DYADIC-CUT` — **DERIVED**',
              'family theorem': 'NS-P2-GEOMETRIC-FRUSTRATION-OR-CUT-FAMILY` — **DERIVED**',
              'coverage disclaimer': 'This is still a family theorem, not a boundary coverage theorem',
              'parent open': 'NS-P2-FRUSTRATION-OR-CUT — OPEN',
          }
          missing = [name for name, marker in geometry_required.items() if marker not in geometry]
          if missing:
              raise SystemExit('missing geometric-family claim markers: ' + ', '.join(missing))

          gauge = Path('paper/NS_P2_POLARIZATION_GAUGE_FRAME_COVER.md').read_text()
          gauge_required = {
              'adapted sparse tensor': 'NS-P2-TRIAD-ADAPTED-SPARSE-TENSOR` — **DERIVED**',
              'basis-invariant single triad refuted': 'NS-P2-SINGLE-TRIAD-HOLONOMY-BASIS-INVARIANT` — **REFUTED**',
              'shared frame mismatch': 'NS-P2-SHARED-MODE-FRAME-MISMATCH` — **DERIVED**',
              'coefficient floor': 'NS-P2-FRAME-MISMATCH-COEFFICIENT-FLOOR` — **DERIVED**',
              'dispersion identity': 'NS-P2-FRAME-DISPERSION-IDENTITY` — **DERIVED**',
              'pair mass': 'NS-P2-FRAME-DISPERSION-PAIR-MASS` — **DERIVED**',
              'standard basis only': 'retained in declared basis only',
              'flux weighting open': 'actual dyadic flux weighting / non-overcounted packing         OPEN',
              'parent open': 'NS-P2-FRUSTRATION-OR-CUT                                       OPEN',
          }
          missing = [name for name, marker in gauge_required.items() if marker not in gauge]
          if missing:
              raise SystemExit('missing polarization-gauge claim markers: ' + ', '.join(missing))

          compatible = Path('paper/NS_P2_FRAME_COMPATIBLE_DYADIC_HOLONOMY.md').read_text()
          compatible_required = {
              'network PASS': 'NS-P2-FRAME-COMPATIBLE-3D-DYADIC-NETWORK` — **PASS**',
              'coeff PASS': 'NS-P2-FRAME-COMPATIBLE-CHANNEL-COEFF-ALLN` — **PASS**',
              'holonomy': 'NS-P2-FRAME-COMPATIBLE-DYADIC-HOLONOMY-ALLN` — **DERIVED**',
              'tax': 'NS-P2-FRAME-COMPATIBLE-DYADIC-TAX` — **DERIVED**',
              'H3 floor': 'NS-P2-FRAME-COMPATIBLE-DYADIC-H3-FLOOR` — **DERIVED**',
              'zero-D phase-SAT refuted': 'NS-P2-ZERO-FRAME-DISPERSION-IMPLIES-PHASE-SAT` — **REFUTED**',
              'zero-D lower-dimensional refuted': 'NS-P2-ZERO-FRAME-DISPERSION-IS-LOWER-DIMENSIONAL` — **REFUTED**',
              'coverage open': 'full actual-flux boundary coverage/decomposition              OPEN',
              'parent open': 'NS-P2-FRUSTRATION-OR-CUT                                      OPEN',
          }
          missing = [name for name, marker in compatible_required.items() if marker not in compatible]
          if missing:
              raise SystemExit('missing frame-compatible holonomy claim markers: ' + ', '.join(missing))

          handoff = Path('CLAY_P0_P2_RESEARCH_HANDOFF_2026-09-11.md').read_text()
          handoff_required = {
              'P0 section': '# P0',
              'P1 section': '# P1',
              'P2 active target': 'NS-P2-FRUSTRATION-OR-CUT',
              'equivalence correction': 'equivalence != refutation',
              'dyadic motif bound': '7\\sqrt2}{8n^2}',
              'next-AI pointer': 'The next AI should begin',
          }
          missing = [name for name, marker in handoff_required.items() if marker not in handoff]
          if missing:
              raise SystemExit('missing P0-P2 handoff markers: ' + ', '.join(missing))

          future = Path('FUTURE_WORK_P2_TRIAD_ATTACK.md').read_text()
          future_required = {
              'holonomy': 'complex phase-holonomy',
              'falsification': 'SAT   -> naive network-frustration claim is REFUTED',
              'frustration-or-cut': 'frustration-or-amplitude-cut lemma',
              'time switching': 'temporal coherence budget',
              'recurrence': 'R_{j+1}',
              'git contract': 'branch\n-> exact checker/theorem document',
          }
          missing = [name for name, marker in future_required.items() if marker not in future]
          if missing:
              raise SystemExit('missing P2 future-work markers: ' + ', '.join(missing))

          print('NS P2 TRIAD ATTACK + POLARIZATION-GAUGE + COMPATIBLE-HOLONOMY CLAIM-BOUNDARY PASS')
          PY
