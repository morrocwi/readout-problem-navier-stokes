name: regenerate-reproduction-ledger

on:
  push:
    branches: [main]
    paths:
      - 'reproduction/checks/**'
      - 'reproduction/generate_ledger.py'
      - '.github/workflows/regenerate-ledger.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ledger:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install finite-check dependencies
        run: python -m pip install --upgrade pip numpy sympy mpmath pyyaml scipy

      - name: Run every volume reproduction checker and regenerate ledger
        run: python reproduction/generate_ledger.py

      - name: Run post-paper discrete epsilon-completion diagnostic
        run: |
          python reproduction/checks/check_discrete_epsilon_completion.py --json "$RUNNER_TEMP/discrete_epsilon_completion_v01.json"
          python - <<'PY'
          import json, os
          from pathlib import Path

          p = Path(os.environ["RUNNER_TEMP"]) / "discrete_epsilon_completion_v01.json"
          r = json.loads(p.read_text())
          assert r["analytic_shear_test"]["pass_1e-12"] is True
          assert r["independent_fft_gate"]["pass_1e-12"] is True
          c = r["adaptive_epsilon_completion"]
          assert c["first_passing_K"] == 4
          assert c["confirmed_K"] == 5
          assert c["continuum_certificate"] == "HOLD"
          print("EPSC finite diagnostic reproduced: K=4 first pass, K=5 confirmation; continuum certificate HOLD")
          PY

      - name: Commit regenerated ledger if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The full reproduction matrix can take several minutes. If main advances
          # meanwhile (often because another ledger run finishes), never rebase two
          # independently generated LEDGER files. Refresh to the newest main, regenerate
          # from that exact source tree, and retry the generated-only commit instead.
          for attempt in 1 2 3; do
            echo "ledger publish attempt $attempt"
            git fetch origin main
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
              echo "main advanced during reproduction; refreshing source and regenerating ledger"
              git reset --hard origin/main
              python reproduction/generate_ledger.py
            fi

            git add reproduction/LEDGER.json reproduction/LEDGER.md
            if git diff --cached --quiet; then
              echo "Ledger already current."
              exit 0
            fi

            git commit -m "regenerate reproduction ledger"
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "push raced with another main update; retrying from newest main"
            git fetch origin main
            git reset --hard origin/main
            python reproduction/generate_ledger.py
          done

          echo "could not publish regenerated ledger after 3 race-safe attempts" >&2
          exit 1
