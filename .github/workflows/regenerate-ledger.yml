name: regenerate-reproduction-ledger

on:
  push:
    branches: [main]
    paths:
      - 'reproduction/checks/**'
      - 'reproduction/generate_ledger.py'
      - '.github/workflows/regenerate-ledger.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ledger:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install finite-check dependencies
        run: python -m pip install --upgrade pip numpy sympy mpmath pyyaml scipy

      - name: Run every reproduction checker and regenerate ledger
        run: python reproduction/generate_ledger.py

      - name: Commit regenerated ledger if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reproduction/LEDGER.json reproduction/LEDGER.md
          if git diff --cached --quiet; then
            echo "Ledger already current."
          else
            git commit -m "regenerate reproduction ledger"
            git push
          fi
