name: ns-fub-a1c-tube-chain

on:
  pull_request:
    paths:
      - "paper/NS_FUB_A1C_TUBE_CHAIN.md"
      - "reproduction/checks/check_ns_fub_a1c_n1_tube_chain.py"
      - ".github/workflows/ns-fub-a1c-tube-chain.yml"
      - "CLAY_GOVERNANCE_ACK.json"
  push:
    branches:
      - "research/ns-fub-a1c-chain-2026-09-11"
    paths:
      - "paper/NS_FUB_A1C_TUBE_CHAIN.md"
      - "reproduction/checks/check_ns_fub_a1c_n1_tube_chain.py"
      - ".github/workflows/ns-fub-a1c-tube-chain.yml"

jobs:
  exact-tube-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install numerical dependency used by existing exact tensor builder
        run: python3 -m pip install numpy
      - name: exact four-step N1 validated tube chain
        run: python3 reproduction/checks/check_ns_fub_a1c_n1_tube_chain.py
