name: ns-p2-projective-holonomy-type-audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'paper/NS_P2_PROJECTIVE_HOLONOMY_TYPE_AUDIT.md'
      - 'paper/NS_P2_A1_TWO_LINE_ESCAPE_REDUCTION.md'
      - 'reproduction/checks/check_ns_p2_projective_three_line_rigidity.py'
      - 'reproduction/checks/check_ns_p2_orthogonal_turn_fullclosure_escape.py'
      - '.github/workflows/ns-p2-projective-holonomy-type-audit.yml'
      - 'CLAY_GOVERNANCE_ACK.json'
  workflow_dispatch:

jobs:
  exact-projective-type-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install symbolic dependency
        run: python -m pip install sympy
      - name: Exact projective three-line rigidity
        run: python3 reproduction/checks/check_ns_p2_projective_three_line_rigidity.py
      - name: Exact orthogonal-turn full-closure geometry
        run: python3 reproduction/checks/check_ns_p2_orthogonal_turn_fullclosure_escape.py
      - name: Claim-boundary and type guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('paper/NS_P2_PROJECTIVE_HOLONOMY_TYPE_AUDIT.md').read_text()
          required = {
              'projective proposal': 'PROP-P3-PROJECTIVE-THREE-LINE-RIGIDITY-01',
              'phase distinction': 'These are not the same object.',
              'coverage open': '`(PH-3)` is **OPEN**.',
              'global open': '**Global FNW / OCSR / Witness Soundness / G6/G7:** OPEN',
              'clay open': '**Clay Navier–Stokes regularity:** OPEN',
          }
          missing = [name for name, marker in required.items() if marker not in text]
          if missing:
              raise SystemExit('missing type-audit claim markers: ' + ', '.join(missing))

          a1 = Path('paper/NS_P2_A1_TWO_LINE_ESCAPE_REDUCTION.md').read_text()
          required_a1 = {
              'orthogonal-turn proposal': 'PROP-P3-ORTHOGONAL-TURN-FULLCLOSURE-ESCAPE-01',
              'a1 reduction': 'PROP-P3-A1-TWO-LINE-ESCAPE-REDUCTION-01',
              'recursive charging open': 'recursive charging of suppressed descendants                     OPEN',
              'g6 open': 'FNW / G6                                                           OPEN',
              'clay open': 'Clay Navier-Stokes regularity                                      OPEN',
          }
          missing = [name for name, marker in required_a1.items() if marker not in a1]
          if missing:
              raise SystemExit('missing A1 claim markers: ' + ', '.join(missing))
          print('NS P2 PROJECTIVE HOLONOMY / A1 CLAIM-BOUNDARY PASS')
          PY
