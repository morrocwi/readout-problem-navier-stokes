name: build-pvsnp-semantic-closure-paper

on:
  push:
    branches: ["main"]
    paths:
      - "p_vs_np/semantic_closure_accounting_v0.1/*.tex"
      - ".github/workflows/build-pvsnp-semantic-closure-paper.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-paper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-fonts-recommended

      - name: Build PDF twice
        working-directory: p_vs_np/semantic_closure_accounting_v0.1
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error Semantic_Closure_Accounting_P_vs_NP_v0.1.tex
          pdflatex -interaction=nonstopmode -halt-on-error Semantic_Closure_Accounting_P_vs_NP_v0.1.tex
          test -s Semantic_Closure_Accounting_P_vs_NP_v0.1.pdf

      - name: Commit reproducible PDF if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add p_vs_np/semantic_closure_accounting_v0.1/Semantic_Closure_Accounting_P_vs_NP_v0.1.pdf
          if git diff --cached --quiet; then
            echo "PDF unchanged"
          else
            git commit -m "Build P-vs-NP semantic closure preprint PDF"
            git push origin HEAD:main
          fi
