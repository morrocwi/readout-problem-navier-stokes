name: epsc19-practical-schedule-probe

on:
  push:
    branches:
      - epsc19-practical-sample-schedule
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install probe dependencies
        run: python -m pip install --upgrade pip numpy scipy
      - name: Run practical schedule probe
        run: python reproduction/checks/check_volume7_eps19_n1_practical_schedule_probe.py
