name: observableflow-openfoam-real

on:
  workflow_dispatch:
  push:
    paths:
      - 'software/observableflow/benchmarks/openfoam13_cavity/**'
      - 'software/observableflow/observableflow/openfoam.py'
      - 'software/observableflow/observableflow/openfoam_benchmark.py'
      - '.github/workflows/observableflow-openfoam-real.yml'

permissions:
  contents: write

jobs:
  cavity-v13:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[real-openfoam]')
    runs-on: ubuntu-latest
    env:
      UPSTREAM_SHA: 18870c24d21c6b982e2cdec27b2f59738cca5f90
      OPENFOAM_IMAGE: dicehub/openfoam@sha256:a891bb2da102378efc956fb00ff05fc1c686edf38e8343fb87f3603e081ca524
      CASE_DIR: /tmp/observableflow-cavity
      RESULT_PATH: software/observableflow/benchmarks/openfoam13_cavity/results/cavity_v13_result.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ObservableFlow
        run: python -m pip install -e 'software/observableflow[dev,api]'
      - name: Fetch pinned official OpenFOAM-13 cavity case
        run: |
          rm -rf /tmp/OpenFOAM-13 "$CASE_DIR"
          git init /tmp/OpenFOAM-13
          git -C /tmp/OpenFOAM-13 remote add origin https://github.com/OpenFOAM/OpenFOAM-13.git
          git -C /tmp/OpenFOAM-13 config core.sparseCheckout true
          mkdir -p /tmp/OpenFOAM-13/.git/info
          printf '/tutorials/incompressibleFluid/cavity/\n' > /tmp/OpenFOAM-13/.git/info/sparse-checkout
          git -C /tmp/OpenFOAM-13 fetch --depth 1 origin "$UPSTREAM_SHA"
          git -C /tmp/OpenFOAM-13 checkout --detach FETCH_HEAD
          test "$(git -C /tmp/OpenFOAM-13 rev-parse HEAD)" = "$UPSTREAM_SHA"
          cp -a /tmp/OpenFOAM-13/tutorials/incompressibleFluid/cavity "$CASE_DIR"
      - name: Instrument cavity with candidate and reference probes
        run: python software/observableflow/benchmarks/openfoam13_cavity/prepare_case.py "$CASE_DIR" --end-time 2
      - name: Pull pinned OpenFOAM-13 runtime
        run: |
          docker pull "$OPENFOAM_IMAGE"
          echo "OPENFOAM_IMAGE_DIGEST=$OPENFOAM_IMAGE" >> "$GITHUB_ENV"
          echo "pinned image: $OPENFOAM_IMAGE"
      - name: Run real OpenFOAM solver
        run: |
          docker run --rm -v "$CASE_DIR:/home/openfoam/data" "$OPENFOAM_IMAGE" \
            "cd /home/openfoam/data && blockMesh > log.blockMesh 2>&1 && foamRun > log.foamRun 2>&1"
          find "$CASE_DIR/postProcessing/observableFlowCandidates" -type f -name p -print -quit | grep -q .
          find "$CASE_DIR/postProcessing/observableFlowReference" -type f -name U -print -quit | grep -q .
      - name: Analyze train/hold-out sensor-time design
        run: |
          python software/observableflow/benchmarks/openfoam13_cavity/analyze_case.py "$CASE_DIR" --output "$RESULT_PATH"
      - name: Validate benchmark artifact
        run: |
          python - <<'PY'
          import json
          p='software/observableflow/benchmarks/openfoam13_cavity/results/cavity_v13_result.json'
          d=json.load(open(p))
          assert d['simulation'] is True and d['data_label']=='[SimulatedData]'
          mm=d['pressure_velocity']
          assert mm['n_train'] > mm['pod_rank'] and mm['n_test'] >= 2
          assert mm['temporal_design'] and mm['temporal_design']['feasible']
          assert mm['holdout_noiseless'] and mm['holdout_noisy']
          print('PASS', mm['temporal_design'])
          print('holdout noiseless', mm['holdout_noiseless'])
          print('holdout noisy', mm['holdout_noisy'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: observableflow-openfoam13-cavity
          path: |
            ${{ env.RESULT_PATH }}
            /tmp/observableflow-cavity/log.*
          if-no-files-found: warn
      - name: Commit benchmark result to main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT_PATH"
          if git diff --cached --quiet; then
            echo 'No result change to commit.'
            exit 0
          fi
          git commit -m 'Record real OpenFOAM-13 cavity benchmark [skip real-openfoam]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
