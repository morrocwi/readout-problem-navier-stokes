name: ns-p2b-finite-observation

on:
  pull_request:
    branches: [main]
    paths:
      - 'paper/NS_P2B_FINITE_OBSERVATION_WINDOW_ATTACK.md'
      - 'reproduction/checks/check_ns_p2b_critical_intermittency.py'
      - 'reproduction/checks/check_ns_p2b_finite_observation_lift.py'
      - '.github/workflows/ns-p2b-finite-observation.yml'
      - 'CLAY_RESEARCH_TODO.md'
      - 'CLAY_GOVERNANCE_ACK.json'
  workflow_dispatch:

jobs:
  p2b-window-attack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: exact critical-intermittency no-go
        run: python3 reproduction/checks/check_ns_p2b_critical_intermittency.py
      - name: exact finite-observation lift interface
        run: python3 reproduction/checks/check_ns_p2b_finite_observation_lift.py
      - name: claim-boundary guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('paper/NS_P2B_FINITE_OBSERVATION_WINDOW_ATTACK.md').read_text()
          required = {
              'IDM source': 'NS_ENERGY_TRANSFER_OBSERVABILITY.md',
              'EPSC source': 'DISCRETE_EPSILON_COMPLETION.md',
              'finite lift': 'NS-P2B-EPSC-OBS-LIFT',
              'subcritical theorem': 'NS-P2B-SUBCRITICAL-OBS',
              'energy no-go': 'Energy-budget criticality no-go',
              'anti-intermittency OPEN': 'NS-P2B-ANTI-INTERMITTENCY` — OPEN / Clay-bearing',
              'route boundary': 'CLOSED AS A REDUCTION / OPEN AT ANTI-INTERMITTENCY',
              'Clay OPEN': 'Clay Navier--Stokes remains OPEN',
          }
          missing = [name for name, marker in required.items() if marker not in text]
          if missing:
              raise SystemExit('missing P2B claim-boundary markers: ' + ', '.join(missing))
          print('NS P2B CLAIM-BOUNDARY GUARDS PASS')
          PY
