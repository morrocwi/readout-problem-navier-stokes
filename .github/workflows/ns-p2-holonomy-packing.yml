name: ns-p2-holonomy-packing

on:
  pull_request:
    branches: [main]
    paths:
      - 'paper/NS_P2_HOLONOMY_PACKING_DICHOTOMY.md'
      - 'reproduction/checks/check_ns_p2_holonomy_packing_dichotomy.py'
      - '.github/workflows/ns-p2-holonomy-packing.yml'
      - 'CLAY_GOVERNANCE_ACK.json'
  workflow_dispatch:

jobs:
  packing-dichotomy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Exact rational packing fixture
        run: python3 reproduction/checks/check_ns_p2_holonomy_packing_dichotomy.py
      - name: Claim-boundary guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('paper/NS_P2_HOLONOMY_PACKING_DICHOTOMY.md').read_text()
          required = {
              'greedy packing': 'NS-P2-HOLONOMY-GREEDY-PACKING` — **DERIVED**',
              'nonoverlap tax': 'NS-P2-HOLONOMY-NONOVERLAP-TAX` — **DERIVED**',
              'hitting set': 'NS-P2-HOLONOMY-HITTING-SET` — **DERIVED**',
              'dichotomy': 'NS-P2-HOLONOMY-PACKING-OR-HITTING-CUT` — **DERIVED**',
              'fixture': 'NS-P2-HOLONOMY-PACKING-FIXTURE` — **PASS**',
              'coverage open': 'actual critical-flux cycle catalogue/coverage            OPEN',
              'remainder open': 'conflict-free remainder control                          OPEN',
              'parent open': 'NS-P2-FRUSTRATION-OR-CUT                                 OPEN',
          }
          missing = [name for name, marker in required.items() if marker not in text]
          if missing:
              raise SystemExit('missing holonomy-packing claim markers: ' + ', '.join(missing))
          print('NS P2 HOLONOMY PACKING CLAIM-BOUNDARY PASS')
          PY
