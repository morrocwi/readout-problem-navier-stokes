name: n2-shell-observability

on:
  push:
    branches: [main]
    paths:
      - 'reproduction/checks/check_k2_shell_energy_observability.py'
      - 'reproduction/checks/check_k2_shell_explicit_quotient_chart.py'
      - 'reproduction/checks/check_k2_energy_observability.py'
      - '.github/workflows/n2-shell-observability.yml'
  workflow_dispatch:

jobs:
  exact-n2-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact finite-check dependencies
        run: python -m pip install --upgrade pip numpy numba
      - name: Run exact N=2 shell-energy saturation checker
        run: python reproduction/checks/check_k2_shell_energy_observability.py
      - name: Run explicit N=2 quotient shell-chart checker
        run: python reproduction/checks/check_k2_shell_explicit_quotient_chart.py
