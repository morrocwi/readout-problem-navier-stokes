name: ns-p2-h3-margin

on:
  pull_request:
    branches: [main]
    paths:
      - 'paper/NS_P2_FINITE_TO_CONTINUUM_CLOSURE.md'
      - 'reproduction/checks/check_ns_p2_h3_margin_interface.py'
      - '.github/workflows/ns-p2-h3-margin.yml'
      - 'CLAY_GOVERNANCE_ACK.json'
  workflow_dispatch:

jobs:
  exact-h3-margin-interface:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: exact H3 margin interface
        run: python3 reproduction/checks/check_ns_p2_h3_margin_interface.py
      - name: reduction claim guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('paper/NS_P2_FINITE_TO_CONTINUUM_CLOSURE.md').read_text()
          markers = [
              'NS-P2-H3-MARGIN',
              'NS-P2-H3-MARGIN-UNIFORM',
              'CLOSED AS A REDUCTION / OPEN AT ONE LOAD-BEARING LEMMA',
              'No Clay solution is claimed',
          ]
          missing = [m for m in markers if m not in text]
          if missing:
              raise SystemExit('missing P2 reduction markers: ' + ', '.join(missing))
          print('NS P2 H3 MARGIN REDUCTION GUARDS PASS')
          PY
