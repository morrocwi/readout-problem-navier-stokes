name: ns-fub-a1-h3-witness

on:
  pull_request:
    paths:
      - "paper/NS_FUB_A1_H3_FINITE_WITNESS.md"
      - "reproduction/checks/check_ns_fub_a1_h3_certificate.py"
      - ".github/workflows/ns-fub-a1-h3-witness.yml"
      - "CLAY_RESEARCH_TODO.md"
      - "CLAY_GOVERNANCE_ACK.json"
  push:
    branches:
      - "research/ns-fub-a1-h3-witness-2026-09-11"
    paths:
      - "paper/NS_FUB_A1_H3_FINITE_WITNESS.md"
      - "reproduction/checks/check_ns_fub_a1_h3_certificate.py"
      - ".github/workflows/ns-fub-a1-h3-witness.yml"

jobs:
  exact-h3-certificate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: exact finite H3 witness checker
        run: python3 reproduction/checks/check_ns_fub_a1_h3_certificate.py
