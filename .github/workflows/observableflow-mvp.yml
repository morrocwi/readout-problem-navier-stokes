name: observableflow-mvp

on:
  push:
    paths:
      - 'software/observableflow/**'
      - '.github/workflows/observableflow-mvp.yml'
  pull_request:
    paths:
      - 'software/observableflow/**'
      - '.github/workflows/observableflow-mvp.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -e 'software/observableflow[dev,api]'
      - name: Test engine
        run: python -m pytest -q software/observableflow/tests
      - name: Import API
        run: python -c "from observableflow.api import app; assert app.title == 'ObservableFlow API'"
      - name: Run demo
        run: python software/observableflow/examples/two_state_demo.py
