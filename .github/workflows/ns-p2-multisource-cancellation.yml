name: ns-p2-multisource-cancellation

on:
  pull_request:
    branches: [main]
    paths:
      - 'paper/NS_P2_STANDALONE_VNEXT.md'
      - 'paper/NS_P2_NEXT_AI_MANIFESTO_2026-09-11.md'
      - 'paper/NS_P2_MULTISOURCE_CANCELLATION_OCSR_GEN1.md'
      - 'paper/NS_P2_W123_WITNESS_SOUNDNESS_REUSE_AUDIT.md'
      - 'paper/NS_P2_ANTIPODAL_CANCELLATION_OUTWARD_FAMILY.md'
      - 'paper/NS_P2_ANTIPODAL_CANCELLATION_LADDER.md'
      - 'paper/NS_P2_CROSS_FAMILY_BOUNDARY_CANCELLATION.md'
      - 'paper/NS_P2_GENERAL_ANCHOR_CROSS_NULLITY.md'
      - 'paper/NS_P2_MULTI_ANCHOR_SUPPRESSION.md'
      - 'paper/NS_P2_SHELL_CONDITIONED_SPAN.md'
      - 'paper/NS_P2_RANK2_POLARIZATION_PLANE_RIGIDITY.md'
      - 'paper/NS_P2_RANK2_SELFCLOSURE_PLANARITY.md'
      - 'reproduction/checks/check_ns_p2_multisource_cancellation.py'
      - 'reproduction/checks/check_ns_p2_witness_soundness_w123.py'
      - 'reproduction/checks/check_ns_p2_antipodal_cancellation_outward.py'
      - 'reproduction/checks/check_ns_p2_antipodal_cancellation_ladder.py'
      - 'reproduction/checks/check_ns_p2_cross_family_boundary_cancellation.py'
      - 'reproduction/checks/check_ns_p2_general_anchor_cross_nullity.py'
      - 'reproduction/checks/check_ns_p2_multi_anchor_suppression.py'
      - 'reproduction/checks/check_ns_p2_shell_conditioned_span.py'
      - 'reproduction/checks/check_ns_p2_rank2_polarization_plane_rigidity.py'
      - 'reproduction/checks/check_ns_p2_rank2_selfclosure_planarity.py'
      - 'paper/NS_P2_UNIFORM_SCALE_LOSS_AUDIT.md'
      - 'reproduction/checks/check_ns_p2_uniform_scale_loss_audit.py'
      - '.github/workflows/ns-p2-multisource-cancellation.yml'
      - 'CLAY_RESEARCH_TODO.md'
      - 'CLAIMS.md'
      - 'CLAY_GOVERNANCE_ACK.json'
  workflow_dispatch:

jobs:
  exact-multisource-cancellation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install checker dependencies
        run: python -m pip install sympy
      - name: Exact multi-source cancellation, direction lock, W3 generation-1 fixtures
        run: python3 reproduction/checks/check_ns_p2_multisource_cancellation.py
      - name: Exact W1/W2/W3 witness-soundness reuse audit
        run: python3 reproduction/checks/check_ns_p2_witness_soundness_w123.py
      - name: Exact antipodal cancellation outward family
        run: python3 reproduction/checks/check_ns_p2_antipodal_cancellation_outward.py
      - name: Exact antipodal cancellation ladder
        run: python3 reproduction/checks/check_ns_p2_antipodal_cancellation_ladder.py
      - name: Exact cross-family boundary cancellation
        run: python3 reproduction/checks/check_ns_p2_cross_family_boundary_cancellation.py
      - name: Exact general anchor-cross nullity locus
        run: python3 reproduction/checks/check_ns_p2_general_anchor_cross_nullity.py
      - name: Exact four-anchor suppression corollary
        run: python3 reproduction/checks/check_ns_p2_multi_anchor_suppression.py
      - name: Exact shell-conditioned span obstruction
        run: python3 reproduction/checks/check_ns_p2_shell_conditioned_span.py
      - name: Exact rank-2 polarization-plane rigidity
        run: python3 reproduction/checks/check_ns_p2_rank2_polarization_plane_rigidity.py
      - name: Exact rank-2 self-closure planarity/escape
        run: python3 reproduction/checks/check_ns_p2_rank2_selfclosure_planarity.py
      - name: Exact uniform scale-loss audit fixtures
        run: python3 reproduction/checks/check_ns_p2_uniform_scale_loss_audit.py
      - name: Claim-boundary guards
        run: |
          python3 - <<'PY'
          from pathlib import Path

          audit = Path('paper/NS_P2_UNIFORM_SCALE_LOSS_AUDIT.md').read_text()
          audit_required = {
              'identity derived': 'NS-P2-SCALE-LOSS-RECURRENCE-IDENTITY` — **DERIVED**',
              'universal refuted': 'NS-P2-SCALE-LOSS-POINTWISE-UNIVERSAL` — **REFUTED**',
              'budget derived': 'NS-P2-SCALE-LOSS-BUDGET-RATIO` — **DERIVED**',
              'equivalent hold': 'NS-P2-UNIFORM-FULLCONV-SCALE-LOSS` — **REGULARITY-EQUIVALENT / HOLD**',
              'residue open': 'constructive generator of shell ratios (NS-P2B-SCALE-CONTRACTION-UNIFORM)  OPEN',
              'clay open': 'Clay Navier-Stokes regularity                                        OPEN',
          }
          missing = [k for k, m in audit_required.items() if m not in audit]
          if missing:
              raise SystemExit('missing scale-loss audit claim markers: ' + ', '.join(missing))

          note = Path('paper/NS_P2_MULTISOURCE_CANCELLATION_OCSR_GEN1.md').read_text()
          required = {
              'direction lock PASS': 'NS-P2-EQUAL-SHELL-DIRECTION-LOCK` — **PASS**',
              'witnesses PASS': 'NS-P2-MULTISOURCE-CANCELLATION-WITNESSES` — **PASS**',
              'gen1 PASS': 'NS-P2-W3-OUTWARD-SUPPRESSION-GEN1` — **PASS**',
              'depth1 PASS': 'NS-P2-W3-FULLCONV-DEPTH1-NOT-LOSSLESS` — **PASS**',
              'no general claim': 'It proves nothing general',
              'no frustration overclaim': 'gives **no** phase frustration at a single shared target',
              'OCSR open': 'OCSR (Section 117.5)                                      OPEN',
              'witness soundness open': 'Witness Soundness for D_cancel                            OPEN',
              'clay open': 'Clay Navier-Stokes regularity                             OPEN',
          }
          missing = [k for k, m in required.items() if m not in note]
          if missing:
              raise SystemExit('missing multisource-cancellation claim markers: ' + ', '.join(missing))

          checks = {
              'paper/NS_P2_CROSS_FAMILY_BOUNDARY_CANCELLATION.md': [
                  'PROP-P3-CROSS-FAMILY-BOUNDARY-CANCEL-01',
                  'Global OCSR / Witness Soundness / cancellation compatibility:** OPEN',
                  'Clay Navier–Stokes regularity:** OPEN'],
              'paper/NS_P2_GENERAL_ANCHOR_CROSS_NULLITY.md': [
                  'PROP-P3-GENERAL-ANCHOR-CROSS-NULLITY-01',
                  'NEW DERIVATION / PROPOSAL; exact algebraic PASS',
                  'Global OCSR / Witness Soundness / cancellation compatibility:** OPEN'],
              'paper/NS_P2_MULTI_ANCHOR_SUPPRESSION.md': [
                  'PROP-P3-MULTI-ANCHOR-SUPPRESSION-01',
                  'NEW DERIVATION / PROPOSAL; exact finite PASS',
                  'Global OCSR / Witness Soundness / cancellation compatibility:** OPEN'],
              'paper/NS_P2_SHELL_CONDITIONED_SPAN.md': [
                  'PROP-P3-SHELL-CONDITIONED-SPAN-01',
                  'shell-conditioned polarization-rank defect',
                  'Global OCSR / Witness Soundness / cancellation compatibility:** OPEN'],
              'paper/NS_P2_RANK2_POLARIZATION_PLANE_RIGIDITY.md': [
                  'PROP-P3-RANK2-POLARIZATION-PLANE-RIGIDITY-01',
                  'NEW DERIVATION / PROPOSAL; exact symbolic PASS',
                  'Global FNW / OCSR / Witness Soundness / cancellation compatibility:** OPEN',
                  'Clay Navier–Stokes regularity:** OPEN'],
              'paper/NS_P2_RANK2_SELFCLOSURE_PLANARITY.md': [
                  'PROP-P3-RANK2-SELFCLOSURE-PLANARITY-01',
                  'NEW DERIVATION / PROPOSAL; exact finite PASS',
                  'Global FNW / OCSR / Witness Soundness / cancellation compatibility:** OPEN',
                  'Clay Navier–Stokes regularity:** OPEN'],
          }
          for path, required in checks.items():
              text = Path(path).read_text()
              missing = [m for m in required if m not in text]
              if missing:
                  raise SystemExit(path + ' missing claim markers: ' + ', '.join(missing))

          standalone = Path('paper/NS_P2_STANDALONE_VNEXT.md').read_text()
          for m in ['**Status:** OPEN', 'Clay Navier–Stokes regularity:** OPEN', '# 118.']:
              if m not in standalone:
                  raise SystemExit('standalone missing marker: ' + m)

          manifesto = Path('paper/NS_P2_NEXT_AI_MANIFESTO_2026-09-11.md').read_text()
          if 'OPEN' not in manifesto or 'counterexample' not in manifesto:
              raise SystemExit('manifesto missing OPEN / counterexample-first markers')

          claims = Path('CLAIMS.md').read_text()
          if 'P2 Standalone vNext' not in claims:
              raise SystemExit('CLAIMS.md lacks the P2 Standalone vNext boundary section')
          print('NS P2 MULTISOURCE CANCELLATION CLAIM-BOUNDARY PASS')
          PY
