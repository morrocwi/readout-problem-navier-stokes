name: build-energy-observability-paper

on:
  push:
    paths:
      - 'paper/NS_ENERGY_OBSERVABILITY_ALL_K_FINAL.tex'
      - '.github/workflows/build-energy-observability-paper.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compile final paper
        uses: xu-cheng/latex-action@v3
        with:
          root_file: NS_ENERGY_OBSERVABILITY_ALL_K_FINAL.tex
          working_directory: paper
          latexmk_use_xelatex: false
      - name: Commit compiled PDF
        run: |
          test -s paper/NS_ENERGY_OBSERVABILITY_ALL_K_FINAL.pdf
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add paper/NS_ENERGY_OBSERVABILITY_ALL_K_FINAL.pdf
          if git diff --cached --quiet; then
            echo 'PDF already up to date.'
          else
            git commit -m 'Build final all-K energy observability PDF'
            git push origin HEAD:main
          fi
