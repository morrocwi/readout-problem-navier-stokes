name: ns-p2-donor-window-charge

on:
  pull_request:
    branches: [main]
    paths:
      - 'paper/NS_P2_FRESH_DONOR_WINDOW_CHARGE.md'
      - 'paper/NS_P2_FRESH_DONOR_RECENT_ANCESTRY.md'
      - 'paper/NS_P2_FRESH_DONOR_MIRROR_CANCELLATION.md'
      - 'paper/NS_P2_PLANAR_ESCAPE_REGULAR_BRANCH.md'
      - 'reproduction/checks/check_ns_p2_fresh_donor_window_charge.py'
      - 'reproduction/checks/check_ns_p2_fresh_donor_recent_ancestry.py'
      - 'reproduction/checks/check_ns_p2_fresh_donor_mirror_cancellation.py'
      - 'reproduction/checks/check_ns_p2_planar_escape_regular_branch.py'
      - '.github/workflows/ns-p2-donor-window-charge.yml'
      - 'CLAY_GOVERNANCE_ACK.json'
  workflow_dispatch:

jobs:
  donor-window-charge:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install symbolic dependency
        run: python -m pip install sympy
      - name: Exact donor window charge checker
        run: python3 reproduction/checks/check_ns_p2_fresh_donor_window_charge.py
      - name: Exact donor recent-ancestry checker
        run: python3 reproduction/checks/check_ns_p2_fresh_donor_recent_ancestry.py
      - name: Exact donor mirror-cancellation checker
        run: python3 reproduction/checks/check_ns_p2_fresh_donor_mirror_cancellation.py
      - name: Exact planar Fourier-support geometry checker
        run: python3 reproduction/checks/check_ns_p2_planar_escape_regular_branch.py
      - name: Claim-boundary guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path('paper/NS_P2_FRESH_DONOR_WINDOW_CHARGE.md').read_text()
          required = {
              'H1 amplitude floor': 'NS-P2-FRESH-DONOR-H1-AMPLITUDE-FLOOR` — **DERIVED**',
              'response/cancellation': 'NS-P2-FRESH-DONOR-RESPONSE-OR-CANCELLATION` — **DERIVED**',
              'window charge': 'NS-P2-FRESH-DONOR-WINDOW-CHARGE` — **DERIVED**',
              'quiet target': 'NS-P2-FRESH-DONOR-QUIET-TARGET-CANCELLATION` — **DERIVED**',
              'overlap measure': 'NS-P2-FRESH-DONOR-HIGH-OVERLAP-MEASURE` — **DERIVED**',
              'multiscale': 'NS-P2-FRESH-DONOR-MULTISCALE-WINDOW-CHARGE` — **DERIVED**',
              'recursive cancellation open': 'recursive non-overcounting of cancellation channels          OPEN',
              'KN adapter open': 'response/cancellation budget -> K_N inequality               OPEN',
              'recurrence open': 'constructive R_j recurrence                                  OPEN',
              'parent open': 'NS-P2-FRUSTRATION-OR-CUT                                     OPEN',
          }
          missing = [name for name, marker in required.items() if marker not in text]
          if missing:
              raise SystemExit('missing donor-window claim markers: ' + ', '.join(missing))

          ancestry = Path('paper/NS_P2_FRESH_DONOR_RECENT_ANCESTRY.md').read_text()
          ancestry_required = {
              'memory tail': 'NS-P2-FRESH-DONOR-STOKES-MEMORY-H1-TAIL` — **DERIVED**',
              'recent ancestry': 'NS-P2-FRESH-DONOR-RECENT-ANCESTRY` — **DERIVED**',
              'large donor recent': 'NS-P2-FRESH-DONOR-LARGE-IMPLIES-RECENT` — **DERIVED**',
              'pair recent': 'NS-P2-FRESH-DONOR-PAIR-RECENT-ANCESTRY` — **DERIVED**',
              'recursive closure open': 'recursive recent-nonlinear ancestry/cancellation closure   OPEN',
              'KN contraction open': 'recent nonlinear window -> K_N contraction                OPEN',
              'parent open': 'NS-P2-FRUSTRATION-OR-CUT                                  OPEN',
          }
          missing = [name for name, marker in ancestry_required.items() if marker not in ancestry]
          if missing:
              raise SystemExit('missing donor-ancestry claim markers: ' + ', '.join(missing))

          mirror = Path('paper/NS_P2_FRESH_DONOR_MIRROR_CANCELLATION.md').read_text()
          mirror_required = {
              'coeff pass': 'NS-P2-FRESH-DONOR-MIRROR-COEFF-CANCEL` — **PASS**',
              'simple cancellation': 'NS-P2-FRESH-DONOR-SIMPLE-CANCELLATION-EXISTS` — **DERIVED**',
              'costly refuted': 'NS-P2-FRESH-DONOR-CANCELLATION-AUTOMATICALLY-COSTLY` — **REFUTED**',
              'nonplanar open': 'non-planar conflict-poor ancestry classification                 OPEN',
          }
          missing = [name for name, marker in mirror_required.items() if marker not in mirror]
          if missing:
              raise SystemExit('missing mirror-cancellation claim markers: ' + ', '.join(missing))

          planar = Path('paper/NS_P2_PLANAR_ESCAPE_REGULAR_BRANCH.md').read_text()
          planar_required = {
              'support invariant': 'NS-P2-PLANAR-FOURIER-SUPPORT-INVARIANT` — **DERIVED**',
              '2D3C reduction': 'NS-P2-PLANAR-2D3C-REDUCTION` — **DERIVED**',
              'regular': 'NS-P2-PLANAR-ESCAPE-REGULAR` — **DERIVED**',
              'singular escape refuted': 'NS-P2-EXACT-PLANAR-FRESH-DONOR-ESCAPE-SINGULAR` — **REFUTED**',
              'orthogonal branch open': 'orthogonal-turn non-planar ancestry closure                  OPEN',
              'parent open': 'NS-P2-FRUSTRATION-OR-CUT                                     OPEN',
          }
          missing = [name for name, marker in planar_required.items() if marker not in planar]
          if missing:
              raise SystemExit('missing planar-branch claim markers: ' + ', '.join(missing))

          print('NS P2 DONOR WINDOW + ANCESTRY + MIRROR + PLANAR BRANCH CLAIM-BOUNDARY PASS')
          PY
