name: compile-observable-continuum-paper

on:
  workflow_dispatch:
  push:
    paths:
      - "paper/NS_OBSERVABLE_TO_CONTINUUM_CERTIFICATES.tex"
      - ".github/workflows/compile-observable-continuum-paper.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile observable-to-continuum manuscript
        uses: xu-cheng/latex-action@v3
        with:
          root_file: NS_OBSERVABLE_TO_CONTINUUM_CERTIFICATES.tex
          working_directory: paper
      - name: Upload manuscript PDF
        uses: actions/upload-artifact@v4
        with:
          name: NS_OBSERVABLE_TO_CONTINUUM_CERTIFICATES
          path: paper/NS_OBSERVABLE_TO_CONTINUUM_CERTIFICATES.pdf
          if-no-files-found: error
      - name: Commit compiled PDF on main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/NS_OBSERVABLE_TO_CONTINUUM_CERTIFICATES.pdf
          if git diff --cached --quiet; then
            echo "Compiled PDF unchanged."
          else
            git commit -m "compile observable-to-continuum certificate manuscript"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
