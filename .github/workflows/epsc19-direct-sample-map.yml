name: epsc19-direct-sample-map

on:
  push:
    branches:
      - epsc19-direct-sample-map-certificate
      - main
    paths:
      - 'reproduction/checks/check_volume6_ns_observability.py'
      - 'reproduction/checks/check_volume7_eps18_n1_local_inverse.py'
      - 'reproduction/checks/check_volume7_eps18_n1_exact_preconditioner.py'
      - 'reproduction/checks/check_volume7_eps18_n1_explicit_radius.py'
      - 'reproduction/checks/check_volume7_eps18_n1_small_witness.py'
      - 'reproduction/checks/check_volume7_eps19_n1_sample_interpolation_conditioning.py'
      - 'reproduction/checks/check_volume7_eps19_n1_direct_sample_inverse.py'
      - '.github/workflows/epsc19-direct-sample-map.yml'
  workflow_dispatch:

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install checker dependencies
        run: python -m pip install --upgrade pip numpy
      - name: Run direct raw-sample inverse certificate
        run: python reproduction/checks/check_volume7_eps19_n1_direct_sample_inverse.py
