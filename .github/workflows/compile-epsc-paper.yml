name: compile-epsc-paper

on:
  workflow_dispatch:
  push:
    paths:
      - "paper/EPSC_NAVIER_STOKES_CERTIFICATES.tex"
      - ".github/workflows/compile-epsc-paper.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile EPSC manuscript
        uses: xu-cheng/latex-action@v3
        with:
          root_file: EPSC_NAVIER_STOKES_CERTIFICATES.tex
          working_directory: paper
      - name: Upload manuscript PDF
        uses: actions/upload-artifact@v4
        with:
          name: EPSC_NAVIER_STOKES_CERTIFICATES
          path: paper/EPSC_NAVIER_STOKES_CERTIFICATES.pdf
          if-no-files-found: error
      - name: Commit compiled PDF on main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/EPSC_NAVIER_STOKES_CERTIFICATES.pdf
          if git diff --cached --quiet; then
            echo "Compiled PDF unchanged."
          else
            git commit -m "compile EPSC Navier-Stokes certificate manuscript"
            git push
          fi
